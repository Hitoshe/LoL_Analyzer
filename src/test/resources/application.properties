spring.application.name=analyzer

riot.api.key=
gemini.api.key=

spring.datasource.url=jdbc:h2:mem:lol;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

analyzer.ddragon.load-on-startup=false
analyzer.outcome.enabled=false
analyzer.collector.enabled=false
