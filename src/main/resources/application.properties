
spring.application.name=analyzer

# Bound from RIOT_API_KEY / GEMINI_API_KEY (environment or project-root .env via AnalyzerApplication).
riot.api.key=${RIOT_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

spring.datasource.url=jdbc:postgresql://localhost:5434/lol_db
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Riot API ---
# Requests per seconds for every routing host. Development key: 20/1s and 100/120s.
# With a production key raise this to the limits shown on developer.riotgames.com.
riot.rate-limit=20:1,100:120
# Longest Retry-After (seconds) worth waiting inside a user request before showing an error.
riot.max-retry-wait-seconds=20

# --- Analysis ---
analyzer.default-region=EUW
analyzer.riot-threads=4
# A cached profile younger than this costs no Riot calls.
analyzer.profile.ttl-minutes=20
# Ranked match ids requested per refresh, and how many unseen matches are downloaded per refresh.
# History grows with every refresh, so personal stats improve over time without spending the whole rate limit at once.
analyzer.profile.match-ids=20
analyzer.profile.max-new-matches=5
# Stored ranked games used for form, role and session.
analyzer.player.recent-games=20

# --- Background jobs ---
# Data Dragon patch check (no key needed).
analyzer.ddragon.refresh-ms=3600000
# Meta / matchup / synergy rebuild from stored matches.
analyzer.stats.window-days=30
analyzer.stats.refresh-ms=1800000
# Finds the real match after each analysis and records the winner for /history calibration.
analyzer.outcome.enabled=true
analyzer.outcome.interval-ms=900000
analyzer.outcome.batch-size=3
# Meta collector over apex ladders. Keep disabled on a development key.
analyzer.collector.enabled=false
analyzer.collector.regions=EUW
analyzer.collector.players-per-run=5
analyzer.collector.matches-per-player=10
analyzer.collector.interval-ms=600000
