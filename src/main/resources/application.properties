
spring.application.name=analyzer

# Bound from RIOT_API_KEY / GEMINI_API_KEY (environment or project-root .env via AnalyzerApplication).
riot.api.key=${RIOT_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

spring.datasource.url=jdbc:postgresql://localhost:5434/lol_db
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
